.poem{font-size:1.15rem}.poem p{margin:.35rem 0}

{html:function(){return '<h2>Sebuah puisi kecil</h2><div class="poem">'+ps(["Aku melihat jarak tumbuh di antara kita,","seperti hujan yang pelan menghapus jejak.","Dulu kupikir dekat berarti terus mengetuk,","padahal pintu pun butuh waktu untuk terbuka.","Maaf untuk langkah yang terlalu cepat,","untuk suara yang tak mau mendengar.","Kini kubiarkan ruang itu tetap ada,","dan belajar menjaga dari kejauhan yang hangat.","Jika nanti angin membawamu kembali, itu hakmu.","Jika tidak, semoga kamu tenang di mana pun kamu berada."],1.4,.3)+'</div>'}},

{html:function(){return '<h2>Permintaan maafku</h2><div class="card letter">'+ps(["Kepada kamu,","Aku minta maaf karena sudah membuatmu risih, ilfil, dan tidak nyaman. Aku terlalu memaksa dan kurang peka pada batasan serta hal-hal yang tidak kamu suka. Itu kesalahanku.","Aku sadar sikapku mungkin membuat hubungan kita menjadi jauh dan canggung. Aku tidak akan membuat alasan untuk itu.","Aku berjanji akan lebih banyak mendengarkan, menghormati batasan, dan tidak mengulangi kesalahan yang sama.","Kamu tidak berkewajiban memaafkan, ataupun kembali dekat. Permintaan maaf ini bukan tuntutan."],1.6,.3)+'</div>'}},
{html:function(){return '<h2>Janji-janji kecilku</h2><p style="margin:0;color:var(--soft)">Bukan untuk ditagih, hanya pengingat untukku sendiri.</p>'+["Mendengarkan lebih dulu sebelum berbicara.","Menerima kata “tidak” tanpa bertanya berulang.","Memberi ruang saat kamu butuh waktu.","Memeriksa perasaanku sendiri, bukan menuntut perasaanmu."].map(function(t){return '<button class="fc" role="checkbox" aria-checked="false">☐ '+t+'</button>'}).join("")},

{html:function(){return '<h2>Janji yang jujur</h2><p style="margin:0;color:var(--soft)">Janji mudah diucapkan, jadi kamu tidak perlu mempercayainya sekarang. Anggap ini catatan untuk menagihku lewat tindakan, bukan kata-kata.</p><div class="card"><strong>Yang akan kulakukan</strong><ul><li>Berhenti ketika kamu bilang berhenti.</li><li>Bertanya, bukan menebak, soal apa yang membuatmu nyaman.</li><li>Membiarkan pesan tanpa balasan tetap tanpa tagihan.</li><li>Mengakui kalau aku salah lagi, tanpa membela diri.</li></ul></div><div class="card"><strong>Yang tidak akan kulakukan</strong><ul><li>Mengejar jawaban atau menuntut penjelasan.</li><li>Menghubungimu lewat orang lain.</li><li>Membuatmu merasa bersalah.</li><li>Mengungkit hal ini lagi kalau kamu tidak yang memulai.</li></ul></div>'}},
{html:function(){return '<h2>Kepercayaan itu pelan</h2><div class="poem">'+ps(["Kepercayaan tidak kembali lewat kata-kata yang indah, apalagi lewat sebuah website.","Ia kembali lewat hal-hal kecil yang konsisten, dalam waktu yang kamu tentukan.","Aku tidak memasang tenggat. Kamu tidak perlu menilai, menjawab, atau menjelaskan apa pun.","Kalau suatu hari aku lalai, kamu berhak menegurku, dan aku akan mendengarkan."],1.3,.3)+'</div>'}},
{html:function(){return '<h2>Kedekatan yang sehat</h2><p style="margin:0;color:var(--soft)">Ketuk untuk membuka.</p>'+[["Boleh bilang tidak","Tidak harus disertai alasan, dan tidak akan kuanggap sebagai penolakan terhadap dirimu."],["Boleh diam","Diam bukan kesalahan. Aku belajar tidak mengisinya dengan kecemasanku."],["Boleh pergi kapan saja","Kedekatan yang baik tidak mengikat. Pintunya tetap bisa kamu tutup kapan pun."]].map(function(c){return '<button class="fc" aria-expanded="false"><strong>'+c[0]+' ▾</strong><p hidden>'+c[1]+'</p></button>'}).join("")},

{html:function(){return '<svg viewBox="0 0 300 150" width="280" role="img" aria-label="Dua bunga tumbuh berjauhan di bawah langit yang sama"><circle cx="150" cy="40" r="4" fill="#f4a6c0"/><circle cx="70" cy="30" r="3" fill="#c9b6ee"/><circle cx="230" cy="26" r="3" fill="#c9b6ee"/><path d="M70 140V85M230 140V85" stroke="#7bb48a" stroke-width="4"/><circle cx="70" cy="78" r="14" fill="#f4a6c0"/><circle cx="230" cy="78" r="14" fill="#c9b6ee"/><circle cx="70" cy="78" r="5" fill="#fff4b0"/><circle cx="230" cy="78" r="5" fill="#fff4b0"/></svg><p class="quote" style="font-size:1.15rem">Kalau kedekatan pernah membuatmu lelah, kali ini aku ingin belajar bahwa peduli juga berarti tahu kapan harus memberi ruang.</p><div class="fb">Baca pelan-pelan saja.</div>'},wait:1},
{html:function(){return '<h2>Terima kasih</h2><div class="poem">'+ps(["Terima kasih sudah membaca sampai sini.","Itu sudah lebih dari cukup, apa pun yang kamu rasakan.","Pertanyaan setelah ini boleh dijawab dengan jujur, dan kamu boleh menutup halaman ini kapan saja."],1.3,.3)+'</div>'}},

{own:1,html:function(){return '<h1>Bolehkah kita mencoba dekat seperti dulu lagi?</h1><div class="card"><p style="margin:0 0 .6rem">Aku merindukan percakapan yang terasa nyaman, candaan sederhana, dan kedekatan yang tidak harus dipaksakan. Kalau kamu juga menginginkannya, aku ingin mencoba membangun kembali semuanya pelan-pelan. Bukan untuk berpura-pura bahwa tidak pernah ada yang salah, tetapi untuk belajar agar kesalahan yang sama tidak terulang.</p><p style="margin:0">Namun, aku ingin kamu memilih dengan jujur. Aku akan menghargai jawabanmu, apa pun itu.</p></div><div class="row"><button id="yes">Aku mau, kita coba pelan-pelan lagi 🤍</button><button id="no">Maaf, aku belum mau 🌿</button></div><div><button class="ghost" id="back">Kembali</button></div>'},

function go(d){i=Math.max(0,Math.min(scenes.length-1,i+d));save();render()}
var timer;
function render(){clearTimeout(timer);var s=scenes[i];document.body.classList.toggle("noanim",noanim);document.documentElement.style.setProperty("--t",noanim?"0s":".5s");
 main.innerHTML='<div class="scene" style="display:flex;flex-direction:column;gap:16px">'+s.html()+'</div>';
 $("#pos").textContent=i<TOTAL?"Cerita "+(i+1)+" dari "+TOTAL:"Selesai";$("#fill").style.width=Math.min(100,(i+1)/TOTAL*100)+"%";
 nav.innerHTML=s.own?"":'<button class="ghost" id="prev"'+(i===0?" disabled":"")+'>Kembali</button><button id="next">'+(i===0?"Mulai":"Lanjutkan ceritanya")+'</button>';
 if(!s.own){$("#prev").onclick=function(){go(-1)};$("#next").onclick=function(){go(1)}}
 if(s.init)s.init();
 if(s.wait){var n=$("#next");n.style.visibility="hidden";timer=setTimeout(function(){n.style.visibility="visible"},noanim?0:7000)}
 upd();window.scrollTo(0,0);var h=main.querySelector("h1,h2");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
$("#anim").onclick=function(){noanim=!noanim;this.textContent=noanim?"Nyalakan animasi":"Lewati animasi";render()};
$("#mus").onclick=function(){setMusic(!mus.playing)};
$("#restart").onclick=function(){i=0;done={};ans=null;save();render()};
if(i>=16&&!ans)i=15;
try{render()}catch(e){main.textContent="Maaf, terjadi kesalahan. Muat ulang halaman ya."}
})();
</script>
</body>
</html>
